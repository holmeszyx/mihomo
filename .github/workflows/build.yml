name: build-test-alpha

on:
  workflow_dispatch:
  push:
    branches:
      - test/Alpha

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/test/Alpha' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goamd64: v1
            output: linux-amd64-v1
          - goos: linux
            goarch: amd64
            goamd64: v3
            output: linux-amd64-v3
          - goos: linux
            goarch: arm64
            output: linux-arm64
          - goos: windows
            goarch: amd64
            goamd64: v1
            output: windows-amd64-v1
          - goos: windows
            goarch: amd64
            goamd64: v3
            output: windows-amd64-v3

    steps:
      - uses: actions/checkout@v6
        with:
          ref: 'test/Alpha'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set variables
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME,,}-$(git rev-parse --short HEAD)"
          VERSION="${VERSION//\//-}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILDTIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=0" >> "$GITHUB_ENV"

      - name: Build and zip
        id: pack
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
        run: |
          BIN="mihomo-${{ matrix.output }}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi

          go env
          go build -v -tags "with_gvisor" -trimpath -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid=" -o "${BIN}${EXT}"

          ZIP_NAME="${BIN}-${VERSION}.zip"
          zip -j "${ZIP_NAME}" "${BIN}${EXT}"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ steps.pack.outputs.zip_name }}

  publish-prerelease:
    if: ${{ github.ref == 'refs/heads/test/Alpha' }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Delete current release assets
        continue-on-error: true
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: alpha-testing
          deleteOnlyFromDrafts: false

      - name: Update alpha-testing tag
        uses: richardsimko/update-tag@v1
        with:
          tag_name: alpha-testing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-testing
          target_commitish: ${{ github.sha }}
          files: dist/*
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
